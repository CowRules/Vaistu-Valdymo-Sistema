components:
  schemas:
    AgeUnitEnum:
      enum:
      - y
      - m
      - d
      type: string
      description: |-
        * `y` - years
        * `m` - months
        * `d` - days
    BlankEnum:
      enum:
      - ''
    Categories:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        medicines:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - id
      - medicines
      - name
    Dosage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        amount:
          type: number
          format: double
        time:
          $ref: '#/components/schemas/TimeEnum'
        usage:
          type: integer
      required:
      - amount
      - id
      - time
      - usage
    Error:
      type: object
      properties:
        detail:
          type: string
          description: Error message
      required:
      - detail
    Medicine:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        amount:
          type: number
          format: double
        unit:
          $ref: '#/components/schemas/UnitEnum'
        is_global:
          type: boolean
        added_by:
          type: integer
        categories:
          type: array
          items:
            type: integer
      required:
      - added_by
      - amount
      - categories
      - id
      - name
      - unit
    MedicineIntake:
      type: object
      properties:
        reserve_medicine:
          type: integer
        usage:
          type: integer
        duration_from:
          type: string
          format: date
        duration_to:
          type: string
          format: date
          nullable: true
        morning_time:
          type: string
          format: time
          nullable: true
        afternoon_time:
          type: string
          format: time
          nullable: true
        evening_time:
          type: string
          format: time
          nullable: true
        night_time:
          type: string
          format: time
          nullable: true
        last_intake:
          type: string
          format: date-time
      required:
      - reserve_medicine
      - usage
    NullEnum:
      enum:
      - null
    PendingMedicine:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_closed:
          type: boolean
        status:
          $ref: '#/components/schemas/StatusEnum'
        last_modified:
          type: string
          format: date-time
          readOnly: true
        comments:
          type: string
        review_comments:
          type: string
        medicine:
          type: integer
      required:
      - id
      - last_modified
      - medicine
    Profile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        age:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        morning_time:
          type: string
          format: time
          nullable: true
        afternoon_time:
          type: string
          format: time
          nullable: true
        evening_time:
          type: string
          format: time
          nullable: true
        night_time:
          type: string
          format: time
          nullable: true
        is_administrator:
          type: boolean
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - id
      - username
    Reserve:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    ReserveActivity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        consumed_amount:
          type: number
          format: double
        date_time:
          type: string
          format: date-time
          readOnly: true
        reserve_medicine:
          type: integer
      required:
      - consumed_amount
      - date_time
      - id
      - reserve_medicine
    ReserveMedicine:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        amount:
          type: number
          format: double
        medicine:
          type: integer
        reserve:
          type: integer
      required:
      - amount
      - id
      - medicine
      - reserve
    RoleEnum:
      enum:
      - guest
      - admin
      - client
      type: string
      description: |-
        * `guest` - guest
        * `admin` - admin
        * `client` - client
    StatusEnum:
      enum:
      - a
      - r
      - p
      type: string
      description: |-
        * `a` - approved
        * `r` - rejected
        * `p` - pending
    TimeEnum:
      enum:
      - Morning
      - Afternoon
      - Evening
      - Night
      type: string
      description: |-
        * `Morning` - 06:00-12:00
        * `Afternoon` - 12:00-17:00
        * `Evening` - 17:00-21:00
        * `Night` - 21:00-00:00
    UnitEnum:
      enum:
      - ml
      - g
      - pcs
      type: string
      description: |-
        * `ml` - milliliters
        * `g` - grams
        * `pcs` - pieces
    Usage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        age_from:
